<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heygen Flux Unlimited</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-card">
    <!-- Header with Branding -->
    <header class="header">
      <div class="logo-area">
        <div class="pulse-logo">
          <svg class="brand-image" viewBox="0 0 64 64" role="img" aria-label="Heygen Flux Unlimited logo">
            <rect x="3" y="3" width="58" height="58" rx="16" fill="#ffffff"></rect>
            <rect x="12" y="12" width="40" height="40" rx="10" fill="#000000"></rect>
            <path d="M22 20h20v6H28v4h12v6H28v4h14v6H22z" fill="#ffffff"></path>
            <circle cx="44" cy="22" r="5" fill="#ffffff"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Heygen Flux Unlimited</h1>
          <p class="by-author">By <span class="author-name">Flux Unlimited</span></p>
          <p class="founder-tag">Flux Unlimited</p>
        </div>
      </div>
    </header>

    <!-- MAIN ACTIVE WORKSPACE INFO -->
    <main class="main-content" id="active-workspace">
      <!-- Status Display -->
      <div class="status-box">
        <div class="status-row">
          <span class="label">Status:</span>
          <span class="status-badge" id="status-badge">Waiting for Render</span>
        </div>
      </div>

      <!-- Trigger Render Button (Automated action) -->
      <button class="btn" id="btn-start-automation" style="width: 100%; background: #ffffff; color: #000000; border: 1px solid #ffffff; font-weight: bold;">
        <svg viewBox="0 0 24 24" class="btn-icon">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
        Start Render & Auto Download
      </button>

      <!-- Download Settings Section -->
      <div class="settings-box">
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Auto Download</span>
            <span class="setting-subtext">Save video instantly when ready</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-auto-download">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <!-- Manual Download Button Container -->
      <div id="manual-download-container" style="margin-top: 4px;">
        <button class="btn btn-download-pulse" id="btn-manual-download" style="width: 100%;">
          <svg viewBox="0 0 24 24" class="btn-icon">
            <path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
          </svg>
          Download Video
        </button>
      </div>

      <!-- Log Section -->
      <div class="log-section">
        <h3 class="section-title">Activity Logs</h3>
        <div class="log-container" id="log-container">
          <!-- Live logs will be added dynamically -->
        </div>
      </div>
    </main>

    <!-- Footer Status -->
    <footer class="footer">
      <p class="secure-badge">🔒 100% Secure & Local Session</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
